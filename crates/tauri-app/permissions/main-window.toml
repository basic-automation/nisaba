"$schema" = "../gen/schemas/acl-manifests.json"

# N-2.7: Tauri capability split for secret-returning commands.
#
# The main window renders untrusted HTML (marketplace listing descriptions,
# vendor plugin descriptions) with full IPC access, so it must not be able to
# invoke commands that return secrets. This permission allows every app command
# EXCEPT the secret-returning ones:
#   - get_company_secret          (plaintext company secret from the OS keyring)
#   - get_config                  (AppConfig incl. platform secrets)
#   - get_company_platform_config (per-company platform secrets)
# Those are only allowed in the dedicated settings window
# (see settings-window.toml + capabilities/settings.json).
#
# IMPORTANT: Tauri ACL command names do NOT support wildcards, and once ANY app
# permission exists, every app command not explicitly allowed is DENIED. When
# adding a command to `tauri::generate_handler!` in src/main.rs, add it to the
# allow list below AND to settings-window.toml — `cargo test -p nisaba-tauri`
# (src/acl_check.rs) enforces this.
[[permission]]
identifier = "main-window"
description = "All Nisaba app commands except the secret-returning commands (main window)."
commands.allow = [
  "add_company_peer",
  "apply_import_data",
  "approve_company_peer",
  "approve_vendor_plugin",
  "backup_now",
  "cache_images",
  "cache_listing_detail",
  "cancel_ebay_auth",
  "check_platform_auth",
