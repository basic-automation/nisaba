[package]
name = "nisaba-tauri"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nisaba-core = { workspace = true }
nisaba-ebay = { workspace = true }
nisaba-squarespace = { workspace = true }
nisaba-xmrbazaar = { workspace = true }
nisaba-amazon = { workspace = true }
nisaba-p2p = { workspace = true }
nisaba-vendor-runtime = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
zip = "8"
base64 = "0.22"
sha2 = "0.10"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
