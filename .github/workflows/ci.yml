name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `cargo build` does not run Tauri's `beforeBuildCommand` — only
      # `cargo tauri build` does — so `tauri::generate_context!()` panics with
      # "the `frontendDist` configuration is set to ... but this path doesn't
      # exist" unless the Nuxt output is generated first. The generated output
      # is gitignored, so it has to be built here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed by tauri::generate_context!)
        working-directory: frontend
        run: |
          npm ci
          npm run generate

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Drives the real app over WebDriver (scripts/ui-smoke.py). ubuntu-22.04 rather than
  # latest: the harness isolates the app in an unprivileged network namespace, which
  # 24.04's AppArmor policy forbids by default.
  ui-smoke:
    name: UI smoke (WebDriver)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev \
            webkit2gtk-driver \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-smoke

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate

      - name: Build the app and the fixture seeder
        run: cargo build -p nisaba-tauri --bin nisaba-tauri --example ui_fixture --locked

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run the UI smoke test
        run: xvfb-run -a python3 scripts/ui-smoke.py --target-dir target --screenshot ui-smoke/marketplace.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: ui-smoke/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx nuxt typecheck
        continue-on-error: true

      - name: Build
        run: npm run generate
