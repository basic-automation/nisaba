name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # N-10.2: the version strings in Cargo.toml, crates/tauri-app/tauri.conf.json
  # and frontend/package.json must be bumped together; fail CI when they disagree.
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency
        run: python3 scripts/check-version-consistency.py

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The macOS leg matters: every release ships a universal macOS bundle,
        # so the full check/test/clippy suite runs on macOS too.
        # ubuntu-24.04 is pinned rather than -latest: -latest moves to Ubuntu 26
        # from 2026-10-19, and the apt list below (WebKitGTK et al.) is known
        # to resolve on 24.04.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `cargo build` does not run Tauri's `beforeBuildCommand` — only
      # `cargo tauri build` does — so `tauri::generate_context!()` panics with
      # "the `frontendDist` configuration is set to ... but this path doesn't
      # exist" unless the Nuxt output is generated first. The generated output
      # is gitignored, so it has to be built here.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (needed by tauri::generate_context!)
        working-directory: frontend
        run: |
          npm ci
          npm run generate

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Drives the real app over WebDriver (scripts/ui-smoke.py). ubuntu-22.04 rather than
  # latest: the harness isolates the app in an unprivileged network namespace, which
  # 24.04's AppArmor policy forbids by default.
  ui-smoke:
    name: UI smoke (WebDriver)
    runs-on: ubuntu-22.04
    # N-12.5: the job commits the captured README screenshots back to the PR
    # branch so they land in docs/images/ with the PR.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            build-essential \
            libssl-dev \
            webkit2gtk-driver \
            xvfb \
            imagemagick \
            x11-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-smoke

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run generate

      - name: Build the app and the fixture seeder
        run: cargo build -p nisaba-tauri --bin nisaba-tauri --example ui_fixture --locked

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run the UI smoke test
        # N-12.5: --seed-sample-catalog populates a fictional catalog and --screenshot
        # captures the five main views alongside the per-marketplace-tab shots.
        run: xvfb-run -a python3 scripts/ui-smoke.py --target-dir target --screenshot ui-smoke/marketplace.png --seed-sample-catalog

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-smoke-screenshots
          path: ui-smoke/
          if-no-files-found: ignore

      - name: Commit README screenshots to the PR branch
        # N-12.5: the README embeds these PNGs; they are captured from the real app
        # running the fixture install above, then committed back so they land with
        # the PR. Regenerating identical PNGs produces no commit, so this step is
        # self-terminating on the re-triggered run.
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p docs/images
          for v in dashboard products listings vendors inventory; do
            cp "ui-smoke/marketplace-$v.png" "docs/images/readme-$v.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout "${{ github.head_ref }}"
          git add docs/images/readme-*.png
          git diff --cached --quiet || git commit -m "docs: README screenshots captured from the real app on a fixture install (N-12.5)"
          git push origin "HEAD:${{ github.head_ref }}"

  frontend:
    name: Frontend
    # Pinned rather than -latest: -latest moves to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # vue-tsc is pinned in frontend/package.json (devDependencies) and
      # installed by `npm ci` above, so this uses the pinned version —
      # no `npx` fetch of an unpinned, incompatible vue-tsc. A typecheck
      # failure fails the job (no continue-on-error).
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run generate
